<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Лабораторная работа по JSF</title>
    <h:outputStylesheet library="css" name="styles.css"/>
</h:head>

<h:body>
    <div class="container">
        <div class="header">
            <h1>Лабораторная работа по JavaServer Faces</h1>
            <div class="student-info">
                <p><strong>ФИО:</strong> Иванов Иван Иванович</p>
                <p><strong>Группа:</strong> P3212</p>
                <p><strong>Вариант:</strong> 4</p>
            </div>
        </div>

        <div class="clock-section">
            <h2>Текущие дата и время</h2>
            <h:form id="clockForm">
                <p:poll interval="13" update="clockDisplay" />
                <h:panelGroup id="clockDisplay">
                    <div class="clock">
                        <h:outputText value="#{clockBean.currentDateTime}">
                            <f:convertDateTime pattern="dd.MM.yyyy HH:mm:ss" timeZone="Europe/Moscow"/>
                        </h:outputText>
                    </div>
                </h:panelGroup>
            </h:form>
        </div>

        <div class="navigation">
            <h:form>
                <h:commandButton value="Перейти к приложению" action="main" styleClass="btn-primary"/>
            </h:form>
        </div>
    </div>
</h:body>
</html>
